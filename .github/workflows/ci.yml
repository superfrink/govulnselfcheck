name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a new Go release or toolchain change cannot silently rot the
    # build. Same Monday morning slot as the vulncheck scan.
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Deliberately floats: the oldest supported Go and the newest stable.
        # Testing a moving target is the point here.
        go: ['1.22.x', 'stable']
    steps:
      # Actions are pinned to a commit SHA, with the tag in the comment. A tag
      # can be moved to another commit; a SHA cannot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ matrix.go }}
          check-latest: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - run: go vet ./...

      - name: go test
        run: go test -race ./...

      - name: coverage floor (osv + policy)
        run: |
          go test -coverprofile=/tmp/cover.out ./osv/ . >/dev/null 2>&1 || \
            go test -coverprofile=/tmp/cover.out ./osv/ >/dev/null
          cov=$(go tool cover -func=/tmp/cover.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "coverage: ${cov}%"
          awk -v c="$cov" 'BEGIN{ if (c+0 < 90) { print "coverage below 90%"; exit 1 } }'

      - name: build
        run: go build ./...

      - name: example builds
        run: go build -o /tmp/govulnselfcheck-example ./examples/selfcheck-cli

      - name: example smoke test
        run: /tmp/govulnselfcheck-example -h

  cross-compile:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: go build -trimpath -o /tmp/govulnselfcheck-${{ matrix.goos }}-${{ matrix.goarch }} ./examples/selfcheck-cli
