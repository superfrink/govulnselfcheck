name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a new Go release or toolchain change cannot silently rot the
    # build. Same Monday morning slot as the vulncheck scan.
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The go directive is 1.25 because x/mod v0.40 (the version that clears
        # GO-2026-6179/6180) requires it. The oldest supported release is
        # pinned; stable floats, because testing a moving target is the point.
        go: ['1.25.x', 'stable']
    steps:
      # Actions are pinned to a commit SHA, with the tag in the comment. A tag
      # can be moved to another commit; a SHA cannot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ matrix.go }}
          check-latest: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - run: go vet ./...

      # -race on every run: the cache, the bounded worker pool and the periodic
      # loop all have concurrency a plain `go test` never exercises under the
      # detector. -shuffle catches tests that only pass in file order.
      - name: go test
        run: go test -race -shuffle=on ./...

      # One run, under the race detector, and no fallback: the previous version
      # had `|| go test ./osv/`, which turned a failing test in the root package
      # into a passing coverage number.
      - name: coverage floor
        run: |
          go test -race -count=1 -coverprofile=/tmp/cover.out ./...
          cov=$(go tool cover -func=/tmp/cover.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "coverage: ${cov}%"
          awk -v c="$cov" 'BEGIN{ if (c+0 < 88) { print "coverage below 88%"; exit 1 } }'

      - name: build
        run: go build ./...

      - name: example builds
        run: go build -o /tmp/govulnselfcheck-example ./examples/selfcheck-cli

      - name: example smoke test
        run: /tmp/govulnselfcheck-example -h

  cross-compile:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: go build -trimpath -o /tmp/govulnselfcheck-${{ matrix.goos }}-${{ matrix.goarch }} ./examples/selfcheck-cli
