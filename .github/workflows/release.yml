name: release

on:
  push:
    tags: ['v*']

# id-token is what lets cosign and the attestation action get a short-lived
# OIDC identity from GitHub instead of a long-lived signing key.
permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # goreleaser derives the version and the changelog from tags.
          fetch-depth: 0

      # Pin the exact patch that builds the binaries, so a Go release cannot
      # change what a tag produces after the fact.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.22.x'

      - name: test before releasing
        run: go test ./...

      - uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
        with:
          cosign-release: 'v3.1.5'

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: 'v2.20.3'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Fail the release if the bundle we just published does not verify
      # against this workflow's own identity.
      - name: verify the signature
        run: |
          cosign verify-blob \
            --bundle dist/checksums.txt.sigstore.json \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/v.+$" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            dist/checksums.txt

      # Signed statement binding each file's digest to this repo, this commit
      # and this workflow run: "gh attestation verify <file> --repo <repo>".
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
